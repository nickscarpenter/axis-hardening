    - {name: root.System.PreventDoSAttack.DoSPageCount, hardened: "20", default: "20"}
    - {name: root.System.PreventDoSAttack.DoSPageInterval, hardened: "1", default: "1"}
    - {name: root.System.PreventDoSAttack.DoSSiteCount, hardened: "20", default: "50"}
    - {name: root.System.PreventDoSAttack.DoSSiteInterval, hardened: "1", default: "1"}
  warning: "Guide footnote (p.34) mentions a 30 s page interval; the recommended setting is DoSPageInterval=1."
  verified_on: ["M4216-LV 10.12.252"]

