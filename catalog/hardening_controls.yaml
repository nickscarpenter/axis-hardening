# AXIS OS hardening control catalog
# Source: AXIS OS Hardening guide T10177717, 2026-07 (M71.3). Scope: AXIS OS 10.0 and later (CLAUDE.md §6.0).
#
# Evaluation rules (catalog.py / evaluate.py):
# - Parameter presence wins. If a param exists it is evaluated, whatever removed_in says
#   (e.g. System.EditCgi is still present on 10.12 although the guide says the script editor went in 10.11).
# - A missing required param makes the control NOT_SUPPORTED; removed_in / introduced_in only explain why.
#   missing_status: na  -> N/A instead (feature depends on the model, e.g. PTZ).
# - optional: true params are skipped when missing. If every param is skipped -> NOT_SUPPORTED.
# - Comparison is case-insensitive. compare: subset = device list (':'-separated) must only contain allowed items.
# - advisory_from: from this AXIS OS version a NON_COMPLIANT result is downgraded to INFO.
# - default / default_from: factory default value, and versions where it changed (version-aware
#   'Back to firmware defaults' and reverting settings left out of a profile). No default = never reverted.
# - expect: plain words for 'Should be' in the report (CHECK controls; APPLY controls use states.hardened).
# - followup: decision = an INFO result depends on the site (report groups it under "Your decision").
# - feature / states: plain words for the GUI ("Bonjour discovery: Enabled -> Disabled").
# - verified_on lists "model fw" where the parameter names were confirmed with `axharden discover`.

schema_version: 1
guide: "AXIS OS Hardening guide T10177717 (2026-07)"

controls:

# ---------------------------------------------------------------- APPLY controls (guide pp.32-34)

- id: AX-B-001
