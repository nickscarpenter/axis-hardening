  feature: "Brute-force protection"
  states: {hardened: "Enabled (guide values)", unhardened: "Factory values"}
  guide_section: "Default protection > Prevent brute-force attacks"
  guide_page: 5
  csc: ["4", "13"]
  level: default
  kind: apply
  method: param
  params:
    - {name: root.System.PreventDoSAttack.ActivatePasswordThrottling, hardened: "on", optional: true, default: "off", default_from: {"11.5": "on"}}  # optional for older firmware; present on 10.12
