- id: AX-B-011
  title: Secure TLS 1.2 cipher list
  feature: "TLS 1.2 ciphers"
  states: {hardened: "Secure ciphers only", unhardened: "Includes older ciphers"}
  guide_section: "Basic hardening > HTTPS > HTTPS ciphers"
  guide_page: 23
  csc: ["3"]
  level: basic
  kind: apply
  method: param
  compare: subset
  params:
    - name: root.HTTPS.Ciphers
      hardened: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305"
  requires_reboot: true
  warning: "Takes effect after the HTTPS service restarts."
  verified_on: ["M4216-LV 10.12.252"]

- id: AX-B-012
